[package]
name = "clonefleet"
version = "0.1.0"
description = "Run git maintenance actions across many repositories at once"
authors = ["Keegan Witt"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix avoids a lib/bin name collision on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clonefleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# macOS shows the executable's name in the app switcher when the app runs unbundled (`tauri dev`).
[[bin]]
name = "CloneFleet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["process", "sync", "time", "fs"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
